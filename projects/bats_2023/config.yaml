# Processing Pipeline Configuration for BATS 2023
# This config file demonstrates the full pipeline with DaySim and CTRAMP formatting

# config.yaml

# Define directory shorthands
survey_dir: "M:/Data/HomeInterview/Bay Area Travel Study 2023/Data/Full Weighted 2023 Dataset/WeightedDataset_02212025"
weights_dir: "X:/survey_repos/ProjRoot_Mon-Thu20251201/WgtRoot_Mon-Thu20251201_nocommutemode/output/"
output_dir: "E:/Box/Modeling and Surveys/Surveys/Travel Diary Survey/BATS_across_years/20260320"
TM1_shapefile_dir: "E:/GitHub/travel-model-one/utilities/geographies"
TM2_shapefile_dir: "E:/GitHub/TM2/tm2py-utils/tm2py_utils/inputs/maz_taz/shapefiles"
log_file: "{{ output_dir }}/pipeline_2023.log" # If not set, logs just to console, if not absolute saves to .cache directory

# Pipeline configuration
steps:
  - name: load_data
    validate_input: false # This will override @step(validate=True/False) in the function definition
    cache: true
    params:
      input_paths:
        households: "{{ survey_dir }}/hh.csv"
        persons: "{{ survey_dir }}/person.csv"
        days: "{{ survey_dir }}/day.csv"
        unlinked_trips: "{{ survey_dir }}/trip.csv"

  - name: clean_2023_bats
    validate_input: false
    cache: true

  # - name: imputation
  #   validate_input: true

  - name: link_trips
    validate_input: false
    cache: true
    params:
      change_mode_enum: CHANGE_MODE
      transit_mode_enums: [FERRY, TRANSIT, LONG_DISTANCE]
      max_dwell_time: 180  # in minutes
      dwell_buffer_distance: 100  # in meters

  - name: detect_joint_trips
    validate_input: false
    cache: true
    params:
      config:
        method: "mahalanobis"
        # Covariance for Mahalanobis distance calculation
        # Think of this as the standard deviation of measurement noise in each dimension
        # Diagonal: [origin_var_m^2, dest_var_m^2, depart_var_min^2, arrive_var_min^2]
        # Default [10000, 10000, 100, 100] = 100m, 100m, 10min, 10min std devs
        covariance: [10000, 10000, 100, 100]
        # Confidence level: Higher = stricter matching (fewer detections)
        # 0.90 = 90% confidence (strict), 0.75 = moderate, 0.50 = permissive
        confidence_level: 0.90

        # Alternative: simpler buffer method with time/space thresholds
        # method: "buffer"
        # time_threshold_minutes: 15.0
        # space_threshold_meters: 100.0

  - name: extract_tours
    validate_input: false
    cache: true

  # - name: weighting
  #   validate_input: true
  #   cache: true

  - name: add_zone_ids
    validate_input: false
    cache: true
    params:
      zone_geographies:
        - zone_name: "taz"  # Primary TAZ for DaySim (TM1)
          shapefile: "{{ TM2_shapefile_dir }}/tazs_TM2_2_5.shp"
          zone_id_field: "TAZ_NODE"
        - zone_name: "maz"  # Primary MAZ for DaySim (TM2)
          shapefile: "{{ TM2_shapefile_dir }}/mazs_TM2_2_5.shp"
          zone_id_field: "MAZ_NODE"
        # Add additional zone geographies as needed:
        - zone_name: "TAZ1454"
          shapefile: "{{ TM1_shapefile_dir }}/bayarea_rtaz1454_rev1_WGS84.shp"
          zone_id_field: "TAZ1454"

  - name: add_existing_weights
    validate_input: false
    cache: false
    params:
      derive_missing_weights: true
      weights:
        household_weights:
          weight_path: "{{ weights_dir }}/hh_weights.csv"
        person_weights:
          weight_path: "{{ weights_dir }}/person_weights.csv"
        day_weights:
          weight_path: "{{ weights_dir }}/day_weights.csv"
        unlinked_trip_weights:
          weight_id_col: "trip_id"  # Weight file uses 'trip_id' instead of canonical 'unlinked_trip_id'
          weight_col: "trip_weight"  # Weight file uses 'trip_weight' instead of canonical 'unlinked_trip_weight'
          weight_path: "{{ weights_dir }}/trip_weights.csv"
          keep_name: false # Defaults to false, but you could keep original name if desired

  # - name: final_check
  #   validate_input: true

  - name: format_ctramp
    validate_input: false
    cache: false
    params:
      # Income thresholds (in absolute dollars)
      income_low_threshold: 60000  # $60k - below this is 'work_low'
      income_med_threshold: 150000  # $150k - below this is 'work_med'
      income_high_threshold: 240000  # $240k - below this is 'work_high', above is 'work_very high'

      # Income conversion parameters
      income_base_year_dollars: 2023  # Base year for income dollar units

      # Age thresholds
      age_adult: 4  # AgeCategory.AGE_18_TO_24 - Adult threshold for joint tour composition

      # Other parameters
      # This is not optimal, but model requires a binary gender
      gender_default_for_missing: "f"
      taz_field: "TAZ1454"  # TAZ field to use for CTRAMP formatting
      drop_missing_taz: true  # Drop households without valid TAZ

  # This prepares a new set of files formatted for DaySim
  - name: format_daysim
    validate_input: false
    validate_output: true
    cache: false
    params:
      drop_partial_tours: true
      drop_missing_taz: true
      drop_invalid_tours: true

  - name: write_data
    validate_input: true
    params:
      # The "codebook" includes all the labeled enums used in the survey datamodel.
      # This is useful to generate Tableau aliases and for summarization code.
      enum_codebook_path: "{{ output_dir }}/survey/codebook.xlsx"
      output_paths:
        # Standard Survey Formats
        households: "{{ output_dir }}/survey/households_2023.csv"
        persons: "{{ output_dir }}/survey/persons_2023.csv"
        days: "{{ output_dir }}/survey/days_2023.csv"
        unlinked_trips: "{{ output_dir }}/survey/unlinked_trips_2023.csv"
        linked_trips: "{{ output_dir }}/survey/linked_trips_2023.csv"
        tours: "{{ output_dir }}/survey/tours_2023.csv"
        joint_trips: "{{ output_dir }}/survey/joint_trips_2023.csv"

        # DaySim Formats
        households_daysim: "{{ output_dir }}/daysim_2023/households.csv"
        persons_daysim: "{{ output_dir }}/daysim_2023/persons.csv"
        days_daysim: "{{ output_dir }}/daysim_2023/days.csv"
        linked_trips_daysim: "{{ output_dir }}/daysim_2023/linked_trips.csv"
        tours_daysim: "{{ output_dir }}/daysim_2023/tours.csv"

        # CTRAMP Formats
        households_ctramp: "{{ output_dir }}/ctramp_2023/HouseholdData.csv"
        persons_ctramp: "{{ output_dir }}/ctramp_2023/PersonData.csv"
        mandatory_locations_ctramp: "{{ output_dir }}/ctramp_2023/MandatoryLocationData.csv"
        individual_tours_ctramp: "{{ output_dir }}/ctramp_2023/IndivTourData.csv"
        individual_trips_ctramp: "{{ output_dir }}/ctramp_2023/IndivTripData.csv"
        joint_tours_ctramp: "{{ output_dir }}/ctramp_2023/JointTourData.csv"
        joint_trips_ctramp: "{{ output_dir }}/ctramp_2023/JointTripData.csv"
