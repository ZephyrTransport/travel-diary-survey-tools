# Processing Pipeline Configuration for BATS 2019
# This config runs the pipeline through compute_weights and writes the canonical tables;
# it has no formatting steps.

# config.yaml

# Directory shorthands.
#
# Paths are built from *roots* -- MTC_DATA, BOX_DIR, TM1_CLONE and so on -- which
# say where a shared location is mounted on this machine. Roots come from your
# environment or a `.env` file beside the project; see `example.env` for the
# ones this config needs. A root that is referenced but set nowhere is an error
# naming the root, before the pipeline starts.
#
# Only the root is machine-specific. Everything below it is the same for
# everyone and belongs here, where it can be reviewed.
#
# A root that genuinely is the same everywhere can be given a committed default
# in an `ENVS` block, which the environment still wins over:
#
#   ENVS:
#     SOME_SHARED_ROOT: "/opt/shared"
#
# -- Inputs (read only) ---------------------------------------------------------
survey_dir: "{{ MTC_DATA }}/Data/HomeInterview/Bay Area Travel Study 2018-2019/Data/Final Version with Imputations/Final Updated Dataset as of 10-18-2021"
weights_dir: "{{ survey_dir }}/weights"  # the vendor's weights
census_dir: "{{ MTC_DATA }}/Data/Census/BATS Weighting"  # PUMS and Census geography
TM1_shapefile_dir: "{{ TM1_CLONE }}/utilities/geographies"
TM2_shapefile_dir: "{{ TM2PY_UTILS_CLONE }}/tm2py_utils/inputs/maz_taz/shapefiles"

# -- Outputs ------------------------------------------------------------------
output_dir: "{{ BOX_DIR }}/Surveys/Travel Diary Survey/BATS_across_years/20260327"
log_file: "{{ output_dir }}/pipeline_2019.log"  # If not set, logs just to console
# Distance within which a trip end is at a habitual location (home, work,
# school). detect_habitual_locations and extract_tours each have their own
# buffer_meters setting; both use this value here.
habitual_buffer_meters: "300"

# Pipeline configuration
steps:
  - name: load_data
    validate_input: false  # overrides the step's @step() value; leave it out to keep that
    params:
      input_paths:
        households: "{{ survey_dir }}/hh.tsv"
        persons: "{{ survey_dir }}/person.tsv"
        person_days: "{{ survey_dir }}/day.tsv"
        unlinked_trips: "{{ survey_dir }}/trip.tsv"

  - name: clean_2019_bats
    validate_input: false
    validate_output: true
    params:
      weight_col_suffix: sphone_wkday  # This will look for weight columns with the suffix "_sphone_wkday" in each dataframe, e.g. "daywt_sphone_wkday"
      weights_dir: "{{ weights_dir }}"

  # - name: imputation
  #   validate_input: true

  # Impute the fields the weighting controls on, so a household or person is not
  # dropped from a control margin for a blank the survey simply did not capture.
  # Mirrors the bats_2023 step: same method, same seed, same validation, so the
  # two years' income and gender distributions are produced the same way and can
  # be compared. The feature lists are shorter here only because 2019 does not
  # collect occupation, industry, can_drive or num_trips.
  - name: imputation
    validate_input: false
    params:
      impute_columns:
        households:
          - column: income_bin
            method: rf
            missing_values: [MISSING, PNTA]
            categorical_features: [residence_type, residence_rent_own]
            aggregate_from:
              persons:
                pivot_count: [employment, education, student]

        persons:
          # 995 (MISSING) on 5,393 of 9,795 persons, and p_gender is a weighting
          # control, so leaving it blank costs over half the person margin.
          - column: gender
            method: rf
            missing_values: [TRANS, NON_BINARY, MISSING, OTHER, PNTA]
            join_tables: [households]
            categorical_features:
              [age, relationship, employment, education, student, work_mode,
               income_bin, residence_type, residence_rent_own]

      stash_preimputed: true
      random_state: 42     # For reproducibility

      validate_imputation:
        enabled: true
        n_folds: 5
        sample_pct: 5.0

  - name: link_trips
    validate_input: true
    params:
      change_mode_enum: CHANGE_MODE
      transit_mode_enums: [FERRY, TRANSIT, LONG_DISTANCE]
      max_dwell_time: 180  # in minutes
      dwell_buffer_distance: 100  # in meters
      # Break a linked trip where the reported party size changes between
      # segments, on the reading that somebody was picked up or dropped off
      # rather than transferring. No default: state the choice explicitly.
      split_on_occupancy: false

  - name: detect_habitual_locations
    validate_input: true
    params:
      buffer_meters: "{{ habitual_buffer_meters }}"
      # Also add homes found where days were said to begin or end, beside the
      # reported ones. A "home" answer away from the reported home then counts
      # as another home. No default: state the choice.
      include_observed_homes: true

  - name: detect_joint_trips
    validate_input: true
    params:
      method: "mahalanobis"
      # Covariance for Mahalanobis distance calculation
      # Think of this as the standard deviation of measurement noise in each dimension
      # Diagonal: [origin_var_m^2, dest_var_m^2, depart_var_min^2, arrive_var_min^2]
      # [10000, 10000, 100, 100] = 100m, 100m, 10min, 10min std devs
      covariance: [10000, 10000, 100, 100]
      # Confidence level: higher = stricter. It reads backward and is not the
      # share of joint pairs kept. With this covariance, 0.90 closely matches
      # the buffer method below (see JointTripConfig.get_distance_threshold).
      confidence_level: 0.90

      # Alternative: simpler buffer method with time/space thresholds
      # method: "buffer"
      # time_threshold_minutes: 15.0
      # space_threshold_meters: 100.0

  - name: extract_tours
    validate_input: true
    params:
      # A tour is flagged SPATIAL_GAP (and dropped by the formatters) when any
      # internal junction jumps more than this many meters between one trip's
      # destination and the next trip's origin - a missing leg the extractor
      # would otherwise weld into one "survey_complete" tour. 1 km catches genuine
      # teleports while ignoring same-place geocoding jitter.
      spatial_gap_threshold_meters: 1000.0
      buffer_meters: "{{ habitual_buffer_meters }}"

  - name: add_zone_ids
    validate_input: true
    params:
      projected_crs: "EPSG:26910"  # UTM Zone 10N (Bay Area metric CRS for nearest-zone fallback)
      max_snap_distance: 500  # metres; points farther from all zone boundaries remain null (out-of-region)
      zone_geographies:
        - zone_name: "taz"  # TM2 TAZ, used by DaySim
          shapefile: "{{ TM2_shapefile_dir }}/tazs_TM2_2_5.shp"
          zone_id_field: "TAZ_NODE"
        - zone_name: "maz"  # TM2 MAZ, used by DaySim
          shapefile: "{{ TM2_shapefile_dir }}/mazs_TM2_2_5.shp"
          zone_id_field: "MAZ_NODE"
        # Add additional zone geographies as needed:
        - zone_name: "TAZ1454"
          shapefile: "{{ TM1_shapefile_dir }}/bayarea_rtaz1454_rev1_WGS84.shp"
          zone_id_field: "TAZ1454"

  # Cascade `survey_complete` (survey reporting) through hh <-> person <-> day <->
  # trip/tour so it is consistent with what the cleaner measured, then stamp one
  # usability column per profile declared below. The cleaner sets only the leaf
  # -- whether the vendor completed each person-day -- and everything above it is
  # derived here, so the rule lives in one place.
  - name: cascade_completeness
    validate_input: false
    params:
      # One boolean column per profile, on five axes, all answered explicitly.
      # See the bats_2023 config for the full vocabulary; the same three
      # profiles are declared here so the two survey years are gated alike and
      # can be compared without asking which standard each was built under.
      usability_profiles:
        ctramp:
          tour_closes_at: primary_home
          household_day_needs: all_members
          zone_coverage: TAZ1454
          joint_tours: fully_joint
          travel_days: [tuesday, wednesday, thursday]
        daysim:
          tour_closes_at: primary_home
          household_day_needs: all_members
          zone_coverage: taz
          joint_tours: fully_joint
          travel_days: [tuesday, wednesday, thursday]
        analysis:
          tour_closes_at: anywhere
          household_day_needs: nothing
          zone_coverage: none
          joint_tours: partial
          travel_days: [tuesday, wednesday, thursday]
        # Placeholder profiles for vendor weights, to receive the pre-computed weights
        ctramp_rsg:
          tour_closes_at: primary_home
          household_day_needs: all_members
          zone_coverage: TAZ1454
          joint_tours: fully_joint
          travel_days: [tuesday, wednesday, thursday]
        analysis_rsg:
          tour_closes_at: anywhere
          household_day_needs: all_members
          zone_coverage: none
          joint_tours: partial
          travel_days: [tuesday, wednesday, thursday]

  - name: add_existing_weights
    validate_input: false
    params:
      # Required. true: a kept day's dropped trips hand their weight to its kept
      # trips. false: kept trips keep their own. Trips always follow their day.
      preserve_travel_totals: true
      # Required. Households scale by one factor per size (number of persons);
      # sizes from this one up share a factor.
      household_size_top_group: 6
      # Optional. The most a record may grow past its supplied weight, per table.
      max_weight_factor:
        households: 3.0
      derive_missing_weights: true
      weight_profiles: [ctramp_rsg, analysis_rsg]
      weights:
        hh_weight:
          weight_path: "{{ weights_dir }}/households_weights.csv"
        person_weight:
          weight_path: "{{ weights_dir }}/persons_weights.csv"
        person_day_weight:
          weight_path: "{{ weights_dir }}/person_days_weights.csv"
        unlinked_trip_weight:
          weight_path: "{{ weights_dir }}/unlinked_trips_weights.csv"

  - name: compute_weights
    validate_input: true
    params:
      # -- Census controls ---------------------------------------------
      census:
        state_fips: "06"
        pums_year: 2019
        pums_weights: independent
        household_income: all_members
        census_dir: "{{ census_dir }}"

      # Which profiles decide who carries weight, one weight set each, suffixed
      # with the profile name. Named rather than defaulted: with several stamped
      # there is no defensible default, and a silent choice would weight a
      # different universe than the formatters emit.
      weight_profiles: [ctramp, analysis]

      # Homes outside the target zones belong to no zone group and can
      # carry no fitted weight. Error above this share rather than returning
      # nulls quietly. A tripwire for a misconfigured geography.
      max_unplaceable_share: 0.01

      use_imputed_values: false

      # -- Sample Plan Path ------------------------------------------------
      # null: no sample plan for 2019.
      sample_plan: null

      # -- Geography crosswalk ------------------------------------------
      # Specify a polygon file for target zones.  The crosswalk module
      # auto-discovers overlapping PUMAs and builds a population-weighted
      # allocation table using Census blocks + rasterization.
      geography:
        target_zones:
          file: "{{ TM1_shapefile_dir }}/region_county.shp"
          id_field: "fipco"  # null -> single study-area boundary
        resolution: 50         # meters (raster handles boundary fractions)
        min_allocation: 0.01   # drop PUMA slivers below 1%
        # -- Zone groups (optional) ------------------------------------
        # Merge small zones for weighting.
        # Keys are group names, values are lists of zones combined into a single zone group.
        # Also useful for applying names to things.
        zone_groups:
          "Marin/Napa/Solano/Sonoma": ["041", "097", "095", "055"]
          # "Alameda/Contra Costa/San Mateo": ["001", "013", "081"]
          # "San Francisco": ["075"]
          # "Santa Clara": ["085"]
          "San Francisco/San Mateo/Santa Clara": ["075", "081", "085"]
          "Alameda/Contra Costa": ["001", "013"]

      # -- Balancer settings -------------------------------------------
      balancing:
        max_expansion_factor: 7.0    # upper bound = base weight × factor
        min_expansion_factor: 0.01  # lower bound = base weight × factor, OK to be low since we still have absolute floor of 1
        max_base_weight_gap: 0.005   # stop if a zone's base weights miss its household target by more than this share
        min_weight: 1                # absolute floor (no weight < 1)
        # max_weight:                # absolute ceiling (null = no ceiling)
        max_iterations: 10000
        n_workers: 8                 # parallel zone balancing (numba releases GIL)
        default_importance: 100      # baseline importance for controls without an explicit override
        # Lower importance when MOE is higher, to allow more deviation from controls with high sampling variability
        moe_based_importance: true  # derive per-control importance from PUMS replicate-weight MOE
        min_survey_share_ratio: 0.125  # stop if a group's % of area's survey / % of area's PUMS is below this

      # -- Controls to balance against ---------------------------------
      # Each name must match a key in the CONTROLS registry; the docs' Controls
      # page lists them all, with their categories.
      # Optional: merge granular categories before balancing.
      # We start with maximum granularity (e.g. 10 household size categories)
      # and merge up to a coarser set as necessary to achieve convergence.
      # The merge can be global (all zones) or zone-specific
      # merge:
      #   merged_label: [category1, category2, ...]
      # For additional per-zone merges on top of the global merge, use
      # zone_merges:        # keyed by zone group name, or zone ID if in no group
      #   "San Francisco":
      #     further_merged: [category_a, already_merged_label]
      controls:
        # Structural controls, set importance very high to ensure totals are matched exactly (if possible)
        - name: h_total
          importance: 200
        - name: p_total
          importance: 200

        # Household level controls
        - name: h_size
          merge:
            size_3_plus: [size_3, size_4, size_5, size_6, size_7, size_8, size_9, size_10_plus]

        - name: h_income
          merge:
            income_under_100:   [income_under25, income_25to50, income_50to75, income_75to100]

        - name: h_vehicles_per_driver
          merge:
            one_or_more: [one_to_one, more_than_drivers]

        - name: h_workers
          merge:
            workers_2_plus: [workers_2, workers_3, workers_4, workers_5_plus]

        - name: h_children
          merge:
            children_1_plus: [children_1, children_2, children_3, children_4, children_5_plus]

        # Households per target zone within each zone group, which in this case is a county
        - name: h_target_zone
        # - name: h_puma # Tends to be too granular and can make convergence difficult

        # Person level controls (gets aggregated to household level, i.e., num age group per household)
        - name: p_gender
        - name: p_employment
        - name: p_education
          merge:
            no_college: [less_high_school, highschool, vocational]
            college: [some_college, associate, bachelors, grad]

        # BATS 2019 didn't have commute mode, so we can't confidently weight with this target
        # - name: p_commute_mode

        - name: p_student

        - name: p_age
          merge:
            age_5_to_17: [age_5_to_15, age_16_to_17]
            age_75_plus: [age_75_to_84, age_85_and_up]

        - name: p_race_ethnicity
          merge:
            AAPI: [asian, pacific]
            other_multi:  [native, multi, other]

      # -- Diagnostics report ------------------------------------------
      diagnostics:
        output_path: "{{ output_dir }}/weighting_diagnostics_2019.html"

        # Re-run balancing across a grid of max_expansion_factor values and
        # add a diagnostic chart showing fit vs weight quality tradeoffs.
        expansion_factor_grid: [2, 3, 4, 5, 7, 10, 15, 20]

        compare_weights:
          vendor:
            label: vendor
            columns:
              households: hh_weight_ctramp_rsg
              persons: person_weight_ctramp_rsg
              person_days: person_day_weight_ctramp_rsg
              unlinked_trips: unlinked_trip_weight_ctramp_rsg


  - name: write_data
    validate_input: true
    params:
      # Deliver only the documented schema: declared model fields plus the
      # zone and pre-imputation columns steps register. Set false to dump
      # every column on the frame when debugging.
      write_only_canonical: true
      # null: no enum codebook is written.
      enum_codebook_path: null
      output_paths:
        # Standard Survey Formats
        households: "{{ output_dir }}/survey/households_2019.csv"
        persons: "{{ output_dir }}/survey/persons_2019.csv"
        household_days: "{{ output_dir }}/survey/household_days_2019.csv"
        person_days: "{{ output_dir }}/survey/person_days_2019.csv"
        unlinked_trips: "{{ output_dir }}/survey/unlinked_trips_2019.csv"
        linked_trips: "{{ output_dir }}/survey/linked_trips_2019.csv"
        tours: "{{ output_dir }}/survey/tours_2019.csv"
        joint_trips: "{{ output_dir }}/survey/joint_trips_2019.csv"
