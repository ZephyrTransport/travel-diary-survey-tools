# Processing Pipeline Configuration for BATS 2019
# This config file demonstrates the full pipeline with DaySim and CTRAMP formatting

# config.yaml

# Define directory shorthands
survey_dir: "M:/Data/HomeInterview/Bay Area Travel Study 2018-2019/Data/Final Version with Imputations/Final Updated Dataset as of 10-18-2021"
output_dir: "M:/Data/HomeInterview/Bay Area Travel Study (across-years)/pipeline_lmz_20260209"
TM1_shapefile_dir: "E:/GitHub/travel-model-one/utilities/geographies"
TM2_shapefile_dir: "E:/GitHub/TM2/tm2py-utils/tm2py_utils/inputs/maz_taz/shapefiles"
log_file: "{{ output_dir }}/pipeline_2019.log" # If not set, logs just to console, if not absolute saves to .cache directory

# Pipeline configuration
steps:
  - name: load_data
    validate_input: false # This will override @step(validate=True/False) in the function definition
    cache: true
    params:
      input_paths:
        households: "{{ survey_dir }}/hh.tsv"
        persons: "{{ survey_dir }}/person.tsv"
        days: "{{ survey_dir }}/day.tsv"
        unlinked_trips: "{{ survey_dir }}/trip.tsv"

  - name: clean_2019_bats
    validate_input: false
    validate_output: true
    cache: true
    params:
      weight_col_suffix: sphone_wkday  # This will look for weight columns with the suffix "_sphone_wkday" in each dataframe, e.g. "daywt_sphone_wkday"
      weights_dir: "{{ survey_dir }}/weights"

  # - name: imputation
  #   validate_input: true

  - name: link_trips
    validate_input: true
    cache: true
    params:
      change_mode_enum: CHANGE_MODE
      transit_mode_enums: [FERRY, TRANSIT, LONG_DISTANCE]
      max_dwell_time: 180  # in minutes
      dwell_buffer_distance: 100  # in meters

  - name: detect_joint_trips
    validate_input: true
    cache: true
    params:
      config:
        method: "mahalanobis"
        # Covariance for Mahalanobis distance calculation
        # Think of this as the standard deviation of measurement noise in each dimension
        # Diagonal: [origin_var_m^2, dest_var_m^2, depart_var_min^2, arrive_var_min^2]
        # Default [10000, 10000, 100, 100] = 100m, 100m, 10min, 10min std devs
        covariance: [10000, 10000, 100, 100]
        # Confidence level: Higher = stricter matching (fewer detections)
        # 0.90 = 90% confidence (strict), 0.75 = moderate, 0.50 = permissive
        confidence_level: 0.90

        # Alternative: simpler buffer method with time/space thresholds
        # method: "buffer"
        # time_threshold_minutes: 15.0
        # space_threshold_meters: 100.0

  - name: extract_tours
    validate_input: true
    cache: true

  # - name: weighting
  #   validate_input: true
  #   cache: true

  - name: add_zone_ids
    validate_input: true
    cache: true
    params:
      zone_geographies:
        - zone_name: "taz"  # Primary TAZ for DaySim (TM1)
          shapefile: "{{ TM2_shapefile_dir }}/tazs_TM2_2_5.shp"
          zone_id_field: "TAZ_NODE"
        - zone_name: "maz"  # Primary MAZ for DaySim (TM2)
          shapefile: "{{ TM2_shapefile_dir }}/mazs_TM2_2_5.shp"
          zone_id_field: "MAZ_NODE"
        # Add additional zone geographies as needed:
        - zone_name: "TAZ1454"
          shapefile: "{{ TM1_shapefile_dir }}/bayarea_rtaz1454_rev1_WGS84.shp"
          zone_id_field: "TAZ1454"

  - name: add_existing_weights
    validate_input: false
    cache: false
    params:
      derive_missing_weights: true
      weights:
        household_weights:
          weight_path: "{{ survey_dir }}/weights/households_weights.csv"
        person_weights:
          weight_path: "{{ survey_dir }}/weights/persons_weights.csv"
        day_weights:
          weight_path: "{{ survey_dir }}/weights/days_weights.csv"
        unlinked_trip_weights:
          weight_path: "{{ survey_dir }}/weights/unlinked_trips_weights.csv"

  - name: write_data
    validate_input: true
    params:
      output_paths:
        # Standard Survey Formats
        households: "{{ output_dir }}/survey/households_2019.csv"
        persons: "{{ output_dir }}/survey/persons_2019.csv"
        days: "{{ output_dir }}/survey/days_2019.csv"
        unlinked_trips: "{{ output_dir }}/survey/unlinked_trips_2019.csv"
        linked_trips: "{{ output_dir }}/survey/linked_trips_2019.csv"
        tours: "{{ output_dir }}/survey/tours_2019.csv"
        joint_trips: "{{ output_dir }}/survey/joint_trips_2019.csv"
