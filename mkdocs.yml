site_name: Travel Diary Survey Tools
site_description: Documentation for travel diary survey data models and codebooks
repo_url: https://github.com/BayAreaMetro/travel-diary-survey-tools

theme:
  name: material
  palette:
    primary: indigo
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy

plugins:
  - search
  - autorefs
  - include-markdown:
      rewrite_relative_urls: true
  - mkdocstrings:
      handlers:
        python:
          import:
            - https://docs.pydantic.dev/latest/objects.inv
          options:
            docstring_style: google
            group_by_category: true
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: false
            show_symbol_type_toc: false
            members_order: source
            show_bases: false
            show_if_no_docstring: true
            inherited_members: false
            show_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            show_root_members_full_path: false
            heading_level: 2
            # Show class attributes for Pydantic models
            show_root_toc_entry: true
            show_category_heading: false
            annotations_path: source
            line_length: 68
            members: true
            extensions:
              - griffe_pydantic
            filters:
              - "!^_"
              - "!^LabeledEnum$"
              - "!^Enum$"
              - "!^[a-z_]+$"  # Exclude lowercase module variables

nav:
  - Home: index.md
  - Pipeline: pipeline.md
  - Pipeline Steps:
      - pipeline_steps/index.md
      - Load Data: pipeline_steps/read_write.md
      - Cleaning: pipeline_steps/cleaning.md
      - Imputation: pipeline_steps/imputation.md
      - Link Trips: pipeline_steps/link_trips.md
      - Detect Joint Trips: pipeline_steps/detect_joint_trips.md
      - Extract Tours: pipeline_steps/extract_tours.md
      - Model Usability: pipeline_steps/model_usable.md
      - Weighting:
          - Overview: pipeline_steps/weighting/index.md
          - Compute Weights:
              - Overview: pipeline_steps/weighting/compute_weights.md
              - Crosswalk: pipeline_steps/weighting/crosswalk.md
              - Data Preparation: pipeline_steps/weighting/data_preparation.md
              - Balancing: pipeline_steps/weighting/balancing.md
              - Controls: pipeline_steps/weighting/controls.md
              - Diagnostics: pipeline_steps/weighting/diagnostics.md
              - Validation: pipeline_steps/weighting/validation.md
          - Existing Weights: pipeline_steps/weighting/existing_weights.md
      - Format Output:
          - DaySim Format: pipeline_steps/format_output/daysim.md
          - CT-RAMP Format: pipeline_steps/format_output/ctramp.md
      - Final Check: pipeline_steps/final_check.md
  - Data Models:
      - Survey Data Models: models/index.md
      - Travel Model-Formatted Data Models:
          - DaySim: models/daysim.md
          - CTRAMP: models/ctramp.md
  - Codebook:
      - Column Requirements: COLUMN_REQUIREMENTS.md
      - Enum Reference: codebook.md
      - Enums: codebook_enums.md

extra_css:
  - assets/stylesheets/column_matrix.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
