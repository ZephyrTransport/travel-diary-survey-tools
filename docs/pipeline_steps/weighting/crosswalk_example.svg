<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="system-ui, sans-serif">
  <defs>
    <!-- hatching for target zones -->
    <pattern id="hatch-L" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="#2d8a4e" stroke-width="1.2" />
    </pattern>
    <pattern id="hatch-M" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,0 L8,8" stroke="#c49000" stroke-width="1.2" />
    </pattern>
    <pattern id="hatch-R" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="#2d8a4e" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- background -->
  <rect width="520" height="520" fill="#fafafa" rx="6" />

  <!-- title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
    Worked Example — Zone Overlap on 4×4 Raster Grid
  </text>

  <!-- ==================== source zones (solid fills) ==================== -->
  <!-- Source A: x=0–200 m → px 60–260 -->
  <rect x="60" y="40" width="200" height="400" rx="4"
        fill="#4a90d9" opacity="0.18" />
  <!-- Source B: x=200–400 m → px 260–460 -->
  <rect x="260" y="40" width="200" height="400" rx="4"
        fill="#d97b4a" opacity="0.18" />

  <!-- source labels (top) -->
  <text x="160" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">
    Source A (0–200 m)
  </text>
  <text x="360" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#b05c2b">
    Source B (200–400 m)
  </text>

  <!-- ==================== target zones (hatched overlays) ==================== -->
  <!-- Zone L: x=0–150 m → px 60–210 -->
  <rect x="60"  y="40" width="150" height="400" rx="3"
        fill="url(#hatch-L)" opacity="0.5" />
  <rect x="60"  y="40" width="150" height="400" rx="3"
        fill="none" stroke="#2d8a4e" stroke-width="2.5" stroke-dasharray="6 3" />

  <!-- Zone M: x=150–250 m → px 210–310 -->
  <rect x="210" y="40" width="100" height="400" rx="3"
        fill="url(#hatch-M)" opacity="0.5" />
  <rect x="210" y="40" width="100" height="400" rx="3"
        fill="none" stroke="#c49000" stroke-width="2.5" stroke-dasharray="6 3" />

  <!-- Zone R: x=250–400 m → px 310–460 -->
  <rect x="310" y="40" width="150" height="400" rx="3"
        fill="url(#hatch-R)" opacity="0.5" />
  <rect x="310" y="40" width="150" height="400" rx="3"
        fill="none" stroke="#2d8a4e" stroke-width="2.5" stroke-dasharray="6 3" />

  <!-- target zone labels (bottom) -->
  <text x="135" y="458" text-anchor="middle" font-size="11" font-weight="600" fill="#2d8a4e">
    Zone L
  </text>
  <text x="260" y="458" text-anchor="middle" font-size="11" font-weight="600" fill="#9a7400">
    Zone M
  </text>
  <text x="385" y="458" text-anchor="middle" font-size="11" font-weight="600" fill="#2d8a4e">
    Zone R
  </text>

  <!-- ==================== grid lines ==================== -->
  <!-- outer border -->
  <rect x="60" y="60" width="400" height="400" fill="none"
        stroke="#555" stroke-width="1.5" />
  <!-- vertical cell edges -->
  <line x1="160" y1="60" x2="160" y2="460" stroke="#555" stroke-width="0.8" />
  <line x1="260" y1="60" x2="260" y2="460" stroke="#555" stroke-width="0.8" />
  <line x1="360" y1="60" x2="360" y2="460" stroke="#555" stroke-width="0.8" />
  <!-- horizontal cell edges -->
  <line x1="60"  y1="160" x2="460" y2="160" stroke="#555" stroke-width="0.8" />
  <line x1="60"  y1="260" x2="460" y2="260" stroke="#555" stroke-width="0.8" />
  <line x1="60"  y1="360" x2="460" y2="360" stroke="#555" stroke-width="0.8" />

  <!-- ==================== source boundary (solid) at x=200 ==================== -->
  <line x1="260" y1="40" x2="260" y2="460" stroke="#333" stroke-width="2" />

  <!-- ==================== target zone boundaries (dashed) ==================== -->
  <!-- x=150 → px 210 -->
  <line x1="210" y1="40" x2="210" y2="460"
        stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" />
  <!-- x=250 → px 310 -->
  <line x1="310" y1="40" x2="310" y2="460"
        stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- ==================== population values in cells ==================== -->
  <!-- row 0 -->
  <text x="110" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">10</text>
  <text x="210" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">10</text>
  <text x="310" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">20</text>
  <text x="410" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">20</text>
  <!-- row 1 -->
  <text x="110" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">10</text>
  <text x="210" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">10</text>
  <text x="310" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">20</text>
  <text x="410" y="218" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">20</text>
  <!-- row 2 -->
  <text x="110" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">30</text>
  <text x="210" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">30</text>
  <text x="310" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">40</text>
  <text x="410" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">40</text>
  <!-- row 3 -->
  <text x="110" y="418" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">30</text>
  <text x="210" y="418" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">30</text>
  <text x="310" y="418" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">40</text>
  <text x="410" y="418" text-anchor="middle" font-size="20" font-weight="bold" fill="#b05c2b">40</text>

  <!-- ==================== x-axis tick labels ==================== -->
  <text x="60"  y="484" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="160" y="484" text-anchor="middle" font-size="10" fill="#666">100</text>
  <text x="210" y="498" text-anchor="middle" font-size="9" fill="#888" font-style="italic">150</text>
  <text x="260" y="484" text-anchor="middle" font-size="10" fill="#666">200</text>
  <text x="310" y="498" text-anchor="middle" font-size="9" fill="#888" font-style="italic">250</text>
  <text x="360" y="484" text-anchor="middle" font-size="10" fill="#666">300</text>
  <text x="460" y="484" text-anchor="middle" font-size="10" fill="#666">400</text>

  <!-- ==================== legend ==================== -->
  <rect x="60" y="506" width="14" height="10" fill="#4a90d9" opacity="0.35" stroke="#2b6cb0" stroke-width="0.8" />
  <text x="78" y="515" font-size="9" fill="#333">Source A</text>

  <rect x="130" y="506" width="14" height="10" fill="#d97b4a" opacity="0.35" stroke="#b05c2b" stroke-width="0.8" />
  <text x="148" y="515" font-size="9" fill="#333">Source B</text>

  <rect x="210" y="506" width="14" height="10" fill="none" stroke="#2d8a4e" stroke-width="1.5" stroke-dasharray="3 2" />
  <text x="228" y="515" font-size="9" fill="#333">Zone L / R</text>

  <rect x="300" y="506" width="14" height="10" fill="none" stroke="#c49000" stroke-width="1.5" stroke-dasharray="3 2" />
  <text x="318" y="515" font-size="9" fill="#333">Zone M</text>

  <line x1="390" y1="511" x2="404" y2="511" stroke="#333" stroke-width="1.5" />
  <text x="408" y="515" font-size="9" fill="#333">Source boundary</text>
</svg>
